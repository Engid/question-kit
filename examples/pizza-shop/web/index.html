<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1a17;
    --muted: #6d675f;
    --line: #e4dfd7;
    --page: #ffffff;
    --jev: #6b4fbb;
    --jev-soft: #f1edfb;
    --register: #0e7c86;
    --board: #1f3a2e;
    --chalk: #f3efe4;
    --chalk-dim: #b9c7bd;
    --go: #d1372f;
    --focus: #1f3a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Figtree", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    font-variant-numeric: tabular-nums;
  }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 22rem;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 0 2rem;
    height: 100%;
    max-width: 68rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 1rem;
  }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; padding-bottom: .75rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  header .mode { margin-left: auto; color: var(--go); }

  main { display: flex; flex-direction: column; min-height: 0; }
  .chat { flex: 1; overflow-y: auto; padding: 1rem 0; display: flex; flex-direction: column; gap: .35rem; }
  .line { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: .5rem; align-items: baseline; }
  .line .who { color: var(--muted); font-weight: 600; }
  .line.you { margin-top: .9rem; }
  .line.agent .who { color: var(--ink); }
  .line.agent .text { font-weight: 600; }
  .line.jev { color: var(--jev); }
  .line.jev .who { color: var(--jev); font-weight: 500; }
  .line.jev .text { border-left: 2px solid var(--jev-soft); padding-left: .5rem; }
  .line.jev .text .n { color: var(--muted); margin-left: .5rem; }
  .line.code .who, .line.code .text { color: var(--muted); }
  .line.register { color: var(--register); }
  .line.register .who { color: var(--register); font-weight: 500; }
  .line.note { color: var(--muted); font-style: italic; margin-top: .75rem; }
  .line.menu .who { color: var(--board); }
  .line.menu .text { background: var(--board); color: var(--chalk); border-radius: .4rem; padding: .5rem .7rem; line-height: 1.5; }

  form { display: flex; gap: .5rem; padding-top: .75rem; border-top: 1px solid var(--line); }
  form input {
    flex: 1; font: inherit; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: .5rem; background: #fff; color: var(--ink);
  }
  form input:focus-visible, form button:focus-visible, details summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  form button {
    font: inherit; font-weight: 600; padding: .65rem 1.1rem; border: 0; border-radius: .5rem; background: var(--go); color: #fff; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }

  aside { display: flex; flex-direction: column; gap: 1rem; min-height: 0; padding-top: 1rem; }
  .board {
    background: var(--board); color: var(--chalk); border-radius: .6rem; padding: 1rem 1.1rem 1.1rem;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .board h2 { margin: 0 0 .5rem; font-size: 1.05rem; font-weight: 600; color: var(--chalk-dim); }
  .board h2 b { color: var(--chalk); font-weight: 700; }
  .board table { width: 100%; border-collapse: collapse; }
  .board td { padding: .2rem 0; vertical-align: top; }
  .board td.n { width: 1.5rem; color: var(--chalk-dim); }
  .board td.price { text-align: right; white-space: nowrap; padding-left: .75rem; }
  .board tr.total td { border-top: 1px dashed rgba(255,255,255,.25); padding-top: .5rem; font-weight: 700; }
  .board .empty { color: var(--chalk-dim); margin: 0; }

  .requests { overflow-y: auto; min-height: 0; }
  .requests h2 { font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 .25rem; }
  .requests p.cost { margin: 0 0 .5rem; color: var(--muted); font-size: .9rem; }
  details { border-top: 1px solid var(--line); padding: .35rem 0; font-size: .9rem; }
  details summary { cursor: pointer; color: var(--ink); }
  details summary .n { color: var(--muted); }
  .q { margin: .4rem 0 .2rem; color: var(--ink); }
  .q .id { color: var(--muted); }
  .bar { display: grid; grid-template-columns: 5rem 2.6rem minmax(0, 1fr); gap: .4rem; align-items: center; color: var(--muted); }
  .bar i { display: block; height: .5rem; background: var(--jev); border-radius: 2px; }
  .bar i.ok { background: var(--register); }

  @media (max-width: 52rem) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); height: auto; min-height: 100%; }
    aside { order: 1; padding-top: .75rem; }
    main { order: 2; }
    .requests { max-height: 14rem; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .line { animation: appear .18s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Pizza counter</h1>
    <p>Order at the counter; Jev's reads show up beside the chat.</p>
    <span class="mode" id="mode" hidden></span>
  </header>
  <main>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="What can I get for you?" aria-label="Your message">
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <aside>
    <section class="board" aria-label="Your order">
      <h2 id="board-title">Your order</h2>
      <div id="board"><p class="empty">Nothing yet.</p></div>
    </section>
    <section class="requests" aria-label="Requests to Jev">
      <h2>Requests to Jev</h2>
      <p class="cost" id="cost">None yet.</p>
      <div id="requests"></div>
    </section>
  </aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
